<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Kiwi</title>
<style>html,body{margin:0;height:100%;background:#1c2b1c;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
canvas{max-height:100vh;max-width:100vw;touch-action:none}
#m{position:fixed;top:10px;right:10px;background:#0006;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:18px}</style></head><body>
<canvas id="c" width="400" height="600"></canvas><button id="m">🔊</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=400,H=600,PW=62;let G,F;
const MODES={easy:{GAP:235,SP:1.8,EVERY:140,G:.32,F:-6.3},hard:{GAP:140,SP:3.3,EVERY:80,G:.45,F:-7.5}};let mode='easy',GAP,SP,EVERY;
function setMode(m){mode=m;({GAP,SP,EVERY,G,F}=MODES[m])}setMode('easy');
// punga bark texture
const pt=document.createElement('canvas');pt.width=PW;pt.height=36;{const q=pt.getContext('2d');q.fillStyle='#2b1d12';q.fillRect(0,0,PW,36);
 for(let r=0;r<2;r++)for(let i=-1;i<4;i++){const cx=i*20+(r?10:0)+6,cy=r*18+9;q.fillStyle=r?'#4a3322':'#5a3e28';q.beginPath();q.moveTo(cx,cy-8);q.lineTo(cx+9,cy);q.lineTo(cx,cy+8);q.lineTo(cx-9,cy);q.closePath();q.fill();q.fillStyle='#1a110a';q.fillRect(cx-1,cy-2,2,4)}
 q.strokeStyle='#6b4a2f55';for(let i=0;i<14;i++){q.beginPath();const a=Math.random()*PW;q.moveTo(a,0);q.lineTo(a+Math.random()*6-3,36);q.stroke()}}
const bark=x.createPattern(pt,'repeat');
const kiwi=new Image();kiwi.src='kiwi.png';const bg=new Image();bg.src='forest.jpg';
let b,pipes,score,lives,inv,best=0,state='ready',t=0,bx=0;
// ---- sound (Web Audio, all synthesised) ----
let ac,muted=false,musicT=null;
function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',v=.2,f2){if(muted)return;const a=A(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
const sFlap=()=>tone(500,.12,'triangle',.15,900),sScore=()=>{tone(880,.1,'square',.08);setTimeout(()=>tone(1320,.15,'square',.08),90)},
 sHit=()=>tone(200,.3,'sawtooth',.2,60),sOver=()=>[523,392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.18),i*180));
let amb=null;
function music(){if(amb)return;const a=A();amb=a.createGain();amb.gain.value=muted?0:1;amb.connect(a.destination);
 const n=a.createBuffer(1,a.sampleRate*4,a.sampleRate),d=n.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
 const noise=(fr,q,v)=>{const s=a.createBufferSource();s.buffer=n;s.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;f.Q.value=q;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(amb);s.start();return g};
 const wind=noise(400,.6,.35);noise(2500,.8,.05);
 setInterval(()=>{wind.gain.setTargetAtTime(.2+Math.random()*.35,a.currentTime,1.5)},2500);
 const chirp=(f1,f2,d,v,at)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(f1,at);o.frequency.exponentialRampToValueAtTime(f2,at+d);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+d*.2);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g).connect(amb);o.start(at);o.stop(at+d+.05)};
 const bird=()=>{const t0=a.currentTime,base=1800+Math.random()*1800,k=2+Math.floor(Math.random()*4);for(let i=0;i<k;i++)chirp(base*(1+Math.random()*.3),base*(.7+Math.random()*.8),.08+Math.random()*.12,.025,t0+i*.15);setTimeout(bird,800+Math.random()*3500)};
 const tui=()=>{const t0=a.currentTime;chirp(900,1400,.25,.03,t0);chirp(2400,2200,.1,.02,t0+.3);chirp(600,500,.15,.03,t0+.45);setTimeout(tui,6000+Math.random()*9000)};
 const kiwiCall=()=>{const t0=a.currentTime,k=6+Math.floor(Math.random()*6);for(let i=0;i<k;i++)chirp(1400,2900,.45,.045,t0+i*.6);setTimeout(kiwiCall,18000+Math.random()*20000)};
 bird();setTimeout(tui,3000);setTimeout(kiwiCall,5000)}
document.getElementById('m').onclick=e=>{e.stopPropagation();muted=!muted;if(amb)amb.gain.value=muted?0:1;e.target.textContent=muted?'🔇':'🔊'};
// ---- game ----
function reset(){b={x:90,y:H/2,v:0};pipes=[];score=0;t=0;lives=3;inv=0}
function start(m){setMode(m);best=+localStorage['fk_'+m]||0;state='play';b.v=F;sFlap()}
function flap(px){A();music();if(state==='ready'){if(px!==undefined)start(px<W/2?'easy':'hard');return}if(state==='over'){reset();state='ready';return}b.v=F;sFlap()}
addEventListener('keydown',e=>{if(state==='ready'&&(e.key==='e'||e.key==='h')){A();music();start(e.key==='e'?'easy':'hard');return}if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='ready'){A();music();start(mode)}else flap()}});
c.addEventListener('pointerdown',e=>{e.preventDefault();const r=c.getBoundingClientRect();flap((e.clientX-r.left)*W/r.width)});
function update(){if(state!=='play')return;t++;bx=(bx+SP*.4)%W;if(inv>0)inv--;b.v+=G;b.y+=b.v;
 if(t%EVERY===0)pipes.push({x:W,top:60+Math.random()*(H-GAP-180),passed:false});
 for(const p of pipes){p.x-=SP;if(!p.passed&&p.x+PW<b.x){p.passed=true;score++;sScore()}
  if(b.x+16>p.x&&b.x-16<p.x+PW&&(b.y-14<p.top||b.y+14>p.top+GAP))hit(b.y<p.top+GAP/2?4:-7)}
 pipes=pipes.filter(p=>p.x>-PW);if(b.y>H-74)hit(-8);if(b.y<14){b.y=14;b.v=Math.max(b.v,0)}}
function hit(v){b.v=v;if(inv>0)return;lives--;inv=70;if(lives<=0)die();else sHit()}
function die(){state='over';sOver();if(score>best){best=score;localStorage['fk_'+mode]=best}}
function log(px,y,h,cap){x.save();x.translate(px,0);x.fillStyle=bark;x.fillRect(0,y,PW,h);
 const g=x.createLinearGradient(0,0,PW,0);g.addColorStop(0,'#000a');g.addColorStop(.35,'#0000');g.addColorStop(.7,'#0000');g.addColorStop(1,'#000b');x.fillStyle=g;x.fillRect(0,y,PW,h);
 x.fillStyle='#c79a6a';x.beginPath();x.ellipse(PW/2,cap+7,PW/2+3,8,0,0,7);x.fill();x.strokeStyle='#7a5636';x.lineWidth=2;
 for(const rr of[.75,.5,.25]){x.beginPath();x.ellipse(PW/2,cap+7,(PW/2+3)*rr,8*rr,0,0,7);x.stroke()}x.restore()}
function draw(){if(bg.complete){x.drawImage(bg,-bx,-60,W,711);x.drawImage(bg,W-bx,-60,W,711)}else{x.fillStyle='#2e5a2e';x.fillRect(0,0,W,H)}
 for(const p of pipes){log(p.x,0,p.top,p.top-14);log(p.x,p.top+GAP,H,p.top+GAP)}
 x.fillStyle='#3d5e22';x.fillRect(0,H-60,W,60);x.fillStyle='#5c8a30';x.fillRect(0,H-60,W,8);
 if(!(inv>0&&Math.floor(inv/6)%2)){x.save();x.translate(b.x,b.y);x.rotate(Math.max(-.5,Math.min(b.v/12,1)));
  if(kiwi.complete)x.drawImage(kiwi,-36,-27,72,54);x.restore()}
 x.shadowColor='#000';x.shadowBlur=6;x.font='24px sans-serif';x.textAlign='left';x.fillStyle='#e33';x.fillText('♥'.repeat(Math.max(lives,0)),12,34);
 x.fillStyle='#fff';x.textAlign='center';x.font='bold 44px sans-serif';x.fillText(score,W/2,70);x.font='20px sans-serif';
 if(state==='ready'){x.font='bold 36px sans-serif';x.fillText('Flappy Kiwi',W/2,H/2-40);x.font='20px sans-serif';const bt=(bx0,l,col,d)=>{x.fillStyle=col;x.fillRect(bx0,H/2+20,150,60);x.fillStyle='#fff';x.font='bold 24px sans-serif';x.fillText(l,bx0+75,H/2+52);x.font='14px sans-serif';x.fillText(d,bx0+75,H/2+72)};
 x.shadowBlur=0;bt(35,'Easy','#3f7d2acc','tap left · E');bt(215,'Hard','#9c2f2fcc','tap right · H');x.shadowBlur=6;x.font='18px sans-serif';x.fillText('Then tap or press Space to flap',W/2,H/2+120)}
 if(state==='over'){x.font='bold 36px sans-serif';x.fillText('Game over',W/2,H/2-20);x.font='20px sans-serif';x.fillText((mode==='easy'?'Easy':'Hard')+' best: '+best+'   Tap to retry',W/2,H/2+20)}x.shadowBlur=0}
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
</script></body></html>
